server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: forward to the Bun API container.
  location /api/ {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s; # Gemini extraction can take a while
  }

  location / {
    try_files $uri /index.html;
  }
}
